<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformers Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #26384a 0%, #0b0e12 45%, #030405 100%);
      overflow: hidden;
      color: white;
    }

    /* Cybertron-style background */
    body::before {
      content: "";
      position: absolute;
      width: 600px;
      height: 600px;
      background: #e63946;
      opacity: 0.08;
      border-radius: 50%;
      filter: blur(100px);
      top: -200px;
      left: -150px;
    }

    body::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: #1677ff;
      opacity: 0.08;
      border-radius: 50%;
      filter: blur(100px);
      bottom: -200px;
      right: -150px;
    }

    .login-container {
      position: relative;
      z-index: 2;
      width: 390px;
      padding: 45px 35px;
      background: rgba(12, 15, 20, 0.92);
      border: 1px solid #59636e;
      border-radius: 12px;
      box-shadow:
        0 0 25px rgba(0, 119, 255, 0.2),
        inset 0 0 30px rgba(255, 255, 255, 0.02);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
      font-size: 48px;
      font-weight: 900;
      color: #dce3e8;
      text-shadow:
        0 0 5px #fff,
        0 0 15px #247cff;
      letter-spacing: 4px;
    }

    .subtitle {
      text-align: center;
      color: #8995a1;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 35px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      color: #aeb8c2;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 15px;
      background: #090c10;
      border: 1px solid #3e4852;
      border-radius: 5px;
      outline: none;
      color: white;
      font-size: 15px;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #2388ff;
      box-shadow: 0 0 10px rgba(35, 136, 255, 0.35);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0 25px;
      font-size: 12px;
      color: #8e99a5;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .remember input {
      accent-color: #1677ff;
    }

    .options a {
      color: #3891ff;
      text-decoration: none;
    }

    .options a:hover {
      color: #70b2ff;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(90deg, #b51220, #ed2939);
      color: white;
      font-weight: bold;
      font-size: 15px;
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(237, 41, 57, 0.25);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 10px #ed2939,
        0 0 25px rgba(237, 41, 57, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #515b65;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #343c44;
    }

    .signup {
      text-align: center;
      color: #737e89;
      font-size: 13px;
    }

    .signup a {
      color: #3891ff;
      text-decoration: none;
      font-weight: bold;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #2388ff;
      border-style: solid;
    }

    .top-left {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }

    .top-right {
      top: -1px;
      right: -1px;
      border-width: 2px 2px 0 0;
    }

    .bottom-left {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 2px 2px;
    }

    .bottom-right {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }

    @media (max-width: 450px) {
      .login-container {
        width: 90%;
        padding: 40px 25px;
      }

      .logo {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <span class="corner top-left"></span>
    <span class="corner top-right"></span>
    <span class="corner bottom-left"></span>
    <span class="corner bottom-right"></span>

    <div class="logo">TF</div>

    <div class="subtitle">CYBERTRON ACCESS SYSTEM</div>

    <form onsubmit="login(event)">

      <div class="input-group">
        <label>Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          required
        >
      </div>

      <div class="input-group">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          required
        >
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot password?</a>
      </div>

      <button class="login-btn" type="submit">
        Initialize
      </button>

    </form>

    <div class="divider">OR</div>

    <div class="signup">
      New Cybertronian?
      <a href="#">Create Account</a>
    </div>

  </div>

  <script>
    function login(event) {
      event.preventDefault();

      const username = document.getElementById("username").value;

      alert("Welcome, " + username + "! Cybertron access initialized.");
    }
  </script>

</body>
</html>
